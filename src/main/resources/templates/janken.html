<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>じゃんけん</title>
</head>

<body>

  <h1>じゃんけんゲーム</h1>

  <p> ログインユーザ： <span th:text="${username}"></span> </p>

  <h2>エントリー</h2>
  <ul>
    <li th:each="user : ${users}" th:text="${user}"> </li>
  </ul>

  <h2>試合結果</h2>
  <p>
  <div th:each="match, stat : ${matches1}">
    <span>ID:</span>
    <span th:text="${match.id}"></span>
    <span>user1:</span>
    <span th:text="${match.user1}"></span>
    <span>user2:</span>
    <span th:text="${match.user2}"></span>
    <span>user1Hand:</span>
    <span th:text="${match.user1Hand}"></span>
    <span>user2Hand：</span>
    <span th:text="${match.user2Hand}"></span>
  </div>
  </p>

  <p>
  <div th:each="user, stat : ${users1}">
    <!-- ループ変数の user を指定し、th:text を使う -->
    <span th:text="${user.userName}">ユーザー名</span>
  </div>
  </p>



  <p th:if="${username != null}">
    Hi <span th:text="${username}"></span>
    <a th:href="@{/janken(hand='グー', username=${username})}">グー</a>
    <a th:href="@{/janken(hand='チョキ', username=${username})}">チョキ</a>
    <a th:href="@{/janken(hand='パー', username=${username})}">パー</a>

  <div th:if="${myHand != null}">
    <p>あなたの手：<span th:text="${myHand}"></span></p>
    <p>相手の手：<span th:text="${cpuHand}"></span></p>
    <p>結果：<span th:text="${result}"></span></p>
  </div>
  </p>

  <p> <a th:href="@{/logout}">ログアウト</a> </p>

  <p>じゃんけんを始めましょう！</p>

</body>

</html>
